name: Publish Docker Image - Dev

on:
  push:
    branches:
      - ui/develop
      - docs/rework

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/automatic-ripping-machine

jobs:
  test:
    name: Quality Checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgnutls28-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libdiscid-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Configure A.R.M
        run: |
          cp setup/arm.yaml arm.yaml
          sudo mkdir -p /etc/arm/config/ /home/arm/db /home/arm /home/arm/config /home/arm/media /home/arm/music
          sudo cp setup/arm.yaml /etc/arm/config/arm.yaml
          sudo cp setup/apprise.yaml /etc/arm/config/apprise.yaml
          sudo cp setup/.abcde.conf /etc/arm/config/abcde.conf
          sudo mkdir -p /opt/arm/arm /opt/arm/setup
          sudo cp -r arm/migrations /opt/arm/arm
          cp setup/arm.yaml /opt/arm/setup/arm.yaml

      - name: Run A.R.M UI
        run: |
          timeout 1 python ./arm/runui.py || code=$?
          if [[ "${code:-0}" -ne 124 && "${code:-0}" -ne 0 ]]; then
            exit "$code"
          fi

  publish:
    name: Build and Publish Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-dev
          cache-from: type=gha,scope=automatic-ripping-machine
          cache-to: type=gha,mode=max,scope=automatic-ripping-machine

  docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the docs
        run: |
          docker compose -f dev/docs/compose.yaml run --build --rm docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4