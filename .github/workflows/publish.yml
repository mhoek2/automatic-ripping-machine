name: Publish Docker Image - Dev

on:
  push:
    branches:
      - ui/develop
      - beta

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/automatic-ripping-machine

jobs:
  test:
    name: Quality Checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgnutls28-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libdiscid-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Configure A.R.M
        run: |
          cp setup/arm.yaml arm.yaml
          sudo mkdir -p /etc/arm/config/ /home/arm/db /home/arm /home/arm/config /home/arm/media /home/arm/music
          sudo cp setup/arm.yaml /etc/arm/config/arm.yaml
          sudo cp setup/apprise.yaml /etc/arm/config/apprise.yaml
          sudo cp setup/.abcde.conf /etc/arm/config/abcde.conf
          sudo mkdir -p /opt/arm/arm /opt/arm/setup
          sudo cp -r arm/migrations /opt/arm/arm
          cp setup/arm.yaml /opt/arm/setup/arm.yaml

      - name: Run A.R.M UI
        run: |
          timeout 1 python ./arm/runui.py || code=$?
          if [[ "${code:-0}" -ne 124 && "${code:-0}" -ne 0 ]]; then
            exit "$code"
          fi

  publish:
    name: Build and Publish Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version and image tags
        id: version
        run: |
          git fetch --tags --force

          if [[ "${GITHUB_REF_NAME}" == "beta" ]]; then
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            LATEST_TAG=${LATEST_TAG:-v0.1.0}

            VERSION="${LATEST_TAG#v}-beta.${GITHUB_RUN_NUMBER}"

            TAGS="${REGISTRY}/${IMAGE_NAME}:latest-beta
            ${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
          else
            VERSION="latest-dev.${GITHUB_RUN_NUMBER}"
            TAGS="${REGISTRY}/${IMAGE_NAME}:latest-dev"
          fi

          echo "$VERSION" > VERSION
          echo "Generated version: $VERSION"

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha,scope=automatic-ripping-machine
          cache-to: type=gha,mode=max,scope=automatic-ripping-machine