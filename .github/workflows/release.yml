
name: Publish Docker Image - Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/automatic-ripping-machine

jobs:
  validate:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "::error::Releases must be created from master."
            exit 1
          fi

          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          version = os.environ["VERSION_INPUT"]

          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version):
              sys.exit("Invalid version. Expected MAJOR.MINOR.PATCH (e.g. 0.2.0).")

          requested = tuple(map(int, version.split('.')))

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines()

          stable = [
              tuple(map(int, match.groups()))
              for tag in tags
              if (match := re.fullmatch(
                  r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag
              ))
          ]

          latest = max(stable, default=(0, 0, 0))

          print(f"Latest stable version: {'.'.join(map(str, latest))}")
          print(f"Requested version: {version}")

          if requested <= latest:
              sys.exit("Release version must be higher than the latest stable version.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")

          print("Version validation successful.")
          PY

  test:
    name: Quality Checks
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgnutls28-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libdiscid-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Configure A.R.M
        run: |
          cp setup/arm.yaml arm.yaml
          sudo mkdir -p /etc/arm/config/ /home/arm/db /home/arm /home/arm/config /home/arm/media /home/arm/music
          sudo cp setup/arm.yaml /etc/arm/config/arm.yaml
          sudo cp setup/apprise.yaml /etc/arm/config/apprise.yaml
          sudo cp setup/.abcde.conf /etc/arm/config/abcde.conf
          sudo mkdir -p /opt/arm/arm /opt/arm/setup
          sudo cp -r arm/migrations /opt/arm/arm
          cp setup/arm.yaml /opt/arm/setup/arm.yaml

      - name: Run A.R.M UI
        run: |
          timeout 1 python ./arm/runui.py || code=$?
          if [[ "${code:-0}" -ne 124 && "${code:-0}" -ne 0 ]]; then
            exit "$code"
          fi

  publish:
    name: Build and Publish Docker Image
    needs: [validate, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate VERSION file
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          echo "$VERSION" > VERSION
          echo "Building ARM version $VERSION"

      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=automatic-ripping-machine
          cache-to: type=gha,mode=max,scope=automatic-ripping-machine

      - name: Create Git tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  docs:
    name: Build and Deploy Documentation
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the docs
        run: |
          docker compose -f dev/docs/compose.yaml run --build --rm docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
