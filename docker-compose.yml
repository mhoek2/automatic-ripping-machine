services:
  arm:
    image: ghcr.io/mhoek2/automatic-ripping-machine:latest
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ./config:/etc/arm/config
      - ./data:/home/arm/db
      - ./home:/home/arm
      - ./logs:/home/arm/logs
      - ./media:/home/arm/media
      - ./music:/home/arm/Music
      - /dev:/dev
