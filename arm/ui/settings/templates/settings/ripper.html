{% block ripper %}
<div id="ripper_settings" class="settings-tab-pane">
    <form id="ripperSettings" name="ripperSettings" method="post" action="">
        {{ form.hidden_tag() }}

        <div class="ripper-settings">
            {% for group_name, keys in settings_groups.items() %}
            <section class="ripper-settings-group">
                <div class="ripper-settings-group-header">{{ group_name }}</div>
                <div class="ripper-settings-group-body">

                    {% for k in keys %}
                    {% if k in settings %}

                    <div class="ripper-setting">
                        <label class="ripper-setting-label" for="setting_{{ k }}">{{ k }}</label>
                        <input class="ripper-setting-input" type="text" id="setting_{{ k }}" name="{{ k }}" placeholder="{{ settings[k] }}" value="{{ settings[k] }}" aria-label="{{ k }}" {% if ripper_read_only %}disabled title="arm.yaml is read-only"{% endif %}>
                        <a class="ripper-setting-info popovers" href="" onClick="return false;" data-content="{{ jsoncomments[k] | replace('#', '\n') }}" rel="popover" data-placement="top" data-original-title="{{ k }}" title="More information"><i class="fas fa-circle-info"></i></a>
                    </div>

                    {% endif %}
                    {% endfor %}
                </div>
            </section>
            {% endfor %}
        </div>

        <div class="ripper-settings-footer">
            <button id="settings" class="arm-button arm-button-primary" form="ripperSettings" type="submit">Save Settings</button>
        </div>
    </form>
</div>
{% endblock %}
