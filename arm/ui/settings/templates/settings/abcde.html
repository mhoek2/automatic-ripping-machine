{% block abcde %}
    <div id="abcde_settings" class="settings-tab-pane">
        <h4> Music Config </h4>
        <div class="row">
            <div class="col-md-8 mx-auto">
                <form id="abcdeSettings" name="abcdeSettings" method="post" action="">
                    {{ form.hidden_tag() }}
                    <label for="abcdeConfigText">ABCDE Config:</label>
                    <textarea id="abcdeConfigText" name="abcdeConfig" spellcheck="false"
                              class="log-output" style="width:100%; min-height:100vh"
                              {% if abcde_read_only %}
                                disabled="" title="abcde.conf is read-only"
                              {% endif %}
                              >
                              {{ abcde_cfg }}
                            </textarea>
                    <br>
                    <button id="abcdeConfigSubmit" class="btn btn-secondary btn-lg btn-block"
                            form="abcdeSettings">Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
