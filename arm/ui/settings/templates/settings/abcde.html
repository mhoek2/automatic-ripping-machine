{% block abcde %}
    <div id="abcde_settings" class="settings-tab-pane">
        <form id="abcdeSettings" name="abcdeSettings" method="post" action="">
            {{ form.hidden_tag() }}
            <textarea name="abcdeConfig" spellcheck="false" class="log-output"
                        {% if abcde_read_only %}
                        disabled="" title="abcde.conf is read-only"
                        {% endif %}
                        >
                        {{ abcde_cfg }}
                    </textarea>
            <br>

            <div class="ripper-settings-footer">
                <button id="abcdeConfigSubmit" class="arm-button arm-button-primary" form="abcdeSettings">Submit</button>
            </div>
        </form>

    </div>
{% endblock %}
