<div id="confirm-modal" class="arm-modal" aria-hidden="true">
	<div class="arm-modal-backdrop" data-modal-close></div>

    <div class="arm-modal-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="m-body" tabindex="-1">
        <div class="arm-modal-header">
            <div class="arm-modal-icon" aria-hidden="true">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <button class="arm-modal-close" type="button" aria-label="Close dialog" data-modal-close>
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="arm-modal-body">
            <h2 id="confirm-modal-title">Confirm action</h2>
            <p id="m-body">Are you sure you want to continue?</p>
        </div>

        <div class="arm-modal-footer">
            <button class="arm-button arm-button-secondary" type="button" data-modal-close>Cancel</button>
            <button id="save-yes" class="arm-button arm-button-danger" type="button">Confirm</button>
        </div>
    </div>

</div>
