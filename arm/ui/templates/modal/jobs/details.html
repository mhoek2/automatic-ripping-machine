<div id="jobs_details_modal" class="arm-modal" aria-hidden="true">
    <div class="arm-modal-backdrop" data-modal-close></div>
    <div class="arm-modal-dialog job-details-dialog" role="dialog" aria-modal="true" aria-labelledby="job_details_title" tabindex="-1">
        <div class="arm-modal-header">
            <span class="job-details-header-label">Job details</span>
            <button class="arm-modal-close" type="button" aria-label="Close dialog" data-modal-close>
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>

        <div class="arm-modal-body">
            <div class="job-details-content">
                <section class="job-details-overview">
                    <div class="job-details-poster">
                        <img id="job_details_poster" src="" alt="Movie poster">
                    </div>
                    <div class="job-details-info">
                        <div class="job-details-title-row">
                            <h2 id="job_details_title">Unknown title</h2>
                            <span id="job_status_badge_wrapper">
                                <span class="status-dot"></span>
                                <span class="status-text"></span>
                            </span>
                        </div>
                        <div id="job_external_meta"></div>
                        <p id="job_details_plot"></p>
                        <div class="job-details-meta" id="job_details_meta"></div>
                        <a id="job_details_log" href="#" class="arm-button arm-button-secondary">
                            <i class="fa-solid fa-terminal" aria-hidden="true"></i>
                            View log
                        </a>
                    </div>
                </section>

                <section class="job-details-section progress-section">
                    <div id="pipeline"></div>
                    <div id="progress"></div>
                </section>

                <section class="job-details-section">
                    <div id="tracks">
                        <h3 class="tracks-heading">Tracks</h3>
                        <div class="tracks-list"></div>
                        <div class="tracks-actions"></div>
                    </div>
                </section>

                {% if authenticated %}
                    <details class="job-details-section job-details-disclosure">
                        <summary>Technical details</summary>
                        <div id="job_details_technical"></div>
                    </details>
                    <details class="job-details-section job-details-disclosure">
                        <summary>Configuration</summary>
                        <div id="job_details_config"></div>
                    </details>
                {% endif %}
            </div>
        </div>

        <div class="arm-modal-footer">
            <button class="arm-button arm-button-secondary" type="button" data-modal-close>Close</button>
        </div>
    </div>
</div>
