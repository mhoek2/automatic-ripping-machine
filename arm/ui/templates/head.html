{% block head %}
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="viewport" content="viewport-fit=cover, user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" crossorigin="use-credentials"/>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}"/>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">


    <!-- Libraries -->
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/popper.min.js') }}"  crossorigin="anonymous"></script>

    <!-- DEPRECATE BOOTSTRAP -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}" crossorigin="anonymous"></script>

    <!-- Theme -->
    <style>
        html { visibility: hidden; }
    </style>
    <script type="application/javascript">
        function setTheme(theme)
        {
            $("html").attr("data-theme", theme);
            localStorage.setItem("arm-theme", theme);
        }

        function loadTheme()
        {
            const theme = localStorage.getItem("arm-theme") || "dark";
            $("html").attr("data-theme", theme).css("visibility", "visible");
        }

        $(function()
        {
            loadTheme();

            $("#theme-toggle").on("click", function()
            {
                const theme =
                    $("html").attr("data-theme") === "dark"
                        ? "light"
                        : "dark";
                setTheme(theme);
            });
        });
    </script>

    <script type="application/javascript">
        function activeTab(tab) {
            $('.sidebar [id^="nav"]').removeClass("active");
            $('.sidebar #nav' + tab).addClass("active");
        }

        $(function()
        {
            $("#user-menu-toggle").on("click", function(e)
            {
                e.stopPropagation();
                $("#user-menu").toggleClass("open");
                $(this).toggleClass("active");
            });

            $(document).on("click", function()
            {
                $("#user-menu").removeClass("open");
                $("#user-menu-toggle").removeClass("active");
            });

            $("#user-menu").on("click", function(e)
            {
                e.stopPropagation();
            });
        });
    </script>

    <!-- FontAwesome 
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome.1.7.1.all.min.css') }}">
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/form.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/modal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/notifications.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/log.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/sysinfo.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/database.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/settings.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/settings/drives.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/settings/ripper.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/jobs/jobs.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/jobs/pipeline.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/jobs/custom_title.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/jobs/title_search.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/reboot/jobs/settings.css') }}">
    
    <!-- Set Page Title -->
    {% if session["arm_name"] %}
        {% if session["page_title"] %}
            <title>[{{ session["arm_name"] }}] - {{ session["page_title"] }} - ARM</title>
        {% endif %}
    {% else %}
        <title>ARM</title>
    {% endif %}

    {% block head_extra %}{% endblock %}
</head>
{% endblock %}
