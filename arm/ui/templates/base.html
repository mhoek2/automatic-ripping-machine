<!doctype html>
<html data-theme="dark" lang="en">
    {% include 'includes/base/head.html' %}

    <body>
        <div id="notification_container" aria-live="polite" aria-atomic="false"></div>

        <div class="base_container">
            {% include 'includes/base/sidebar.html' %}
            
            <div class="base_content">
                <div id="content">
                    {% include 'includes/base/errors.html' %}

                    {% block content %}{% endblock %}
                </div>

                <!-- Footer -->
                {% include 'includes/base/footer.html' %}
            </div>
        </div>

        {% block js %}
        <script type="text/javascript">
            $(document).ready(function () {
                collectChildServers();

                getNotifications();
                window.setInterval(getNotifications, 2000 );
            });
        </script>
        {% endblock %}

        {% include 'includes/base/feeder.html' %}
    </body>
</html>
