{% extends "base.html" %}

{% block content %}
    <div id="joblist" class="jobs-container"></div>

    {% include 'includes/sysinfo.html' %}
{% endblock %}


{% block js %}
    {{ super() }}

    <script type="module">
        import { activeTab } from './static/js/common.js';
        import { refreshJobs } from './static/js/jobs/refresh.js';

        $(document).ready(function () {
            activeTab("home");

            refreshJobs();
            window.setInterval(refreshJobs, {{ armui_cfg['index_refresh'] }});
        });
    </script>
{% endblock %}
