{% extends "base.html" %}
{% block title %}Title Details{% endblock %}

{% block nav %}{{ super() }}{% endblock %}

{% block content %}

<div class="title-details-page">
    <div class="title-details-card">

    <div class="title-details-poster">
        <a href="select_title?imdbID={{ results["imdbID"] }}&job_id={{ job_id }}">
            <img src="{{ results["Poster"] }}" alt="Poster Image">
        </a>
    </div>

    <div class="title-details-body">
        <div class="title-details-heading">
            <strong>{{ results["Title"] }}</strong>
            <span>{{ results["Type"].capitalize() }} ({{ results["Year"] }})</span>
        </div>

        <div class="title-details-plot">
            <strong>Full Plot</strong>
            <p>{{ results["Plot"] }}</p>
        </div>
    </div>

    <div class="title-details-footer">
        <a href="titlesearch?job_id={{ job_id }}" class="title-details-button title-details-button-secondary">New Search</a>
        <a href="{{ url_for('route_jobs.updatetitle', title=results['Title'], year=results['Year'], imdbID=results['imdbID'], type=results['Type'], poster=results['Poster'], job_id=job_id) }}" class="title-details-button title-details-button-primary">Update Title</a>
    </div>

</div>

</div>
{% endblock %}
