{% extends "base.html" %}
{% block title %}Parameter Changer{% endblock %}
{% block nav %}{{ super() }}{% endblock %}

{% block content %}

<div class="job-settings-page">
    <div class="job-settings-card">

    <form id="changeParams" name="changeParams" action="" method="get" novalidate>
        {{ form.hidden_tag() }}

        <div class="job-setting">
            <label class="job-setting-label" for="{{ form.RIPMETHOD.id }}">{{ form.RIPMETHOD.label.text }}</label>
            {{ form.RIPMETHOD }}
        </div>

        <div class="job-setting">
            <label class="job-setting-label" for="{{ form.DISCTYPE.id }}">{{ form.DISCTYPE.label.text }}</label>
            {{ form.DISCTYPE }}
        </div>

        <div class="job-setting">
            <label class="job-setting-label">{{ form.MAINFEATURE.label.text }}</label>
            <label class="arm-checkbox">
                {{ form.MAINFEATURE(class="switch") }}
                <span></span>
            </label>
        </div>

        <div class="job-setting">
            <label class="job-setting-label" for="{{ form.MINLENGTH.id }}">{{ form.MINLENGTH.label.text }}</label>
            <div class="job-setting-control">
                {{ form.MINLENGTH }}
                <div class="job-setting-error" id="MINLENGTH_INVALID">errors</div>
            </div>
        </div>

        <div class="job-setting">
            <label class="job-setting-label" for="{{ form.MAXLENGTH.id }}">{{ form.MAXLENGTH.label.text }}</label>
            <div class="job-setting-control">
                {{ form.MAXLENGTH }}
                <div class="job-setting-error" id="MAXLENGTH_INVALID">Title can't be blank</div>
            </div>
        </div>

        <input name="mode" value="change_job_params" hidden>
        <input name="config_id" value="{{ config.CONFIG_ID }}" hidden>

        <div class="job-settings-footer">
            <button class="arm-button arm-button-primary" type="submit">Submit</button>
        </div>
    </form>

</div>

{{ conf }}

</div>

<script type="application/javascript">
    $(function () {
        function sendSettings(formToSend, sendTo) {
            $.ajax({
                type: 'GET',
                url: sendTo,
                data: formToSend.serialize()
            }).done(function (data) {
                if (data.success === true) {
                    // no action required
                }
            });
        }

        $("#changeParams").submit(function (e) {
            e.preventDefault();
            sendSettings($("#changeParams"), "/json");
        });

        {% for field, errors in form.errors.items() %}
            $("[name='{{field}}']").addClass("is-invalid");
            $("div#{{ field }}_INVALID").html("{{ errors }}");
        {% endfor %}
    });
</script>

{% endblock %}
