{% extends "base.html" %}

{% block content %}
<div class="login-page">
    <div class="login-card">

        <div class="login-header">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='img/arm80nw.png') }}" alt="Automatic Ripping Machine">
            </div>
            <h1>Automatic Ripping Machine</h1>
            <p>Sign in to continue</p>
        </div>

        <form id="form1" name="form1" method="post" action="login">
            {{ form.hidden_tag() }}

            <div class="login-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" value="" autocomplete="username" autofocus>
                {% for error in form.username.errors %}
                    <div class="login-error">{{ error }}</div>
                {% endfor %}
            </div>

            <div class="login-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
                {% for error in form.password.errors %}
                    <div class="login-error">{{ error }}</div>
                {% endfor %}
            </div>

            <input type="hidden" name="save" value="save">

            <button class="arm-button arm-button-primary" form="form1" type="submit">Login</button>
        </form>

    </div>
</div>
{% endblock %}
