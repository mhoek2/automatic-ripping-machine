name: arm-dev

services:
  arm:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ..:/opt/arm
      - ./config:/etc/arm/config
      - ./data:/home/arm/db
      - ./media:/home/arm/media
      - ./logs:/home/arm/logs
    environment:
      MODE_DEV: "true"
      TZ: Europe/Amsterdam
    command: python3 /opt/arm/arm/runui.py

  dbgate:
    image: dbgate/dbgate:latest
    container_name: arm-dbgate
    restart: unless-stopped
    ports:
      - "8081:3000"
    volumes:
      - ./data:/db
      - dbgate-data:/root/.dbgate
    environment:
      TZ: Europe/Amsterdam
      LOGIN: admin
      PASSWORD: admin
      CONNECTIONS: arm
      LABEL_arm: ARM SQLite
      FILE_arm: /db/arm.db
      ENGINE_arm: sqlite@dbgate-plugin-sqlite

volumes:
  dbgate-data:
