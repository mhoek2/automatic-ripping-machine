name: arm-dev

services:
  arm:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ..:/opt/arm
      - ./config:/etc/arm/config
      - ./data:/home/arm/db
      - ./media:/home/arm/media
      - ./logs:/home/arm/logs
    environment:
      MODE_DEV: "true"
      TZ: Europe/Amsterdam
    command: python3 /opt/arm/arm/runui.py

  phpliteadmin:
    image: vtacquet/phpliteadmin:latest
    container_name: arm-phpliteadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./data:/db
    environment:
      TZ: Europe/Amsterdam
      PASSWORD: admin
      LOCATION: /db